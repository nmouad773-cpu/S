name: Live Streamer Automation

on:
  schedule:
    # إعادة تشغيل السكريبت تلقائياً كل 3 ساعات و 40 دقيقة لضمان استمرار البث 24/7
    - cron: '0 */4 * * *'
  workflow_dispatch: # إمكانية التشغيل اليدوي بنقرة زر

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm install axios

      - name: Run Streaming Script
        run: node streamer.js
